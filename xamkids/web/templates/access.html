{% extends "base.html" %}
{% block body %}
<div style="max-width:380px;margin:12vh auto 0;padding:0 20px">
  <h1 style="margin:0 0 8px">XamKids Profile</h1>
  <p class="muted" style="margin:0 0 20px">{{ "Enter the access code." if LANG == "en" else "Saisissez le code d'accès." }}</p>
  <form method="post" style="display:flex;gap:10px">
    <input type="password" name="code" autofocus required autocomplete="current-password"
           aria-label="{{ 'Access code' if LANG == 'en' else "Code d'accès" }}"
           style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff">
    <button class="btn primary">{{ "Enter" if LANG == "en" else "Entrer" }}</button>
  </form>
  {% if wrong %}<p style="color:var(--red, #B42318);margin-top:12px">{{ "Wrong code." if LANG == "en" else "Code incorrect." }}</p>{% endif %}
</div>
{% endblock %}
